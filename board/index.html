<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>현황판 자동 전환</title>
<style>
  :root { --mint:#14a58c; --ink:#16302b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #f3fbf9; overflow: hidden;
    font-family: "Pretendard Variable", Pretendard, -apple-system, system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0;
    opacity: 0; transition: opacity .8s ease; pointer-events: none; }
  iframe.on { opacity: 1; pointer-events: auto; }
  .bar { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 10;
    display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 999px;
    background: rgba(255,255,255,.85); box-shadow: 0 4px 14px rgba(0,0,0,.08); font-size: 13px; color: var(--ink);
    opacity: .25; transition: opacity .2s; }
  .bar:hover { opacity: 1; }
  .bar button { font: inherit; border: 0; cursor: pointer; padding: 5px 12px; border-radius: 999px; background: #e2f6f1; color: #0e8a75; font-weight: 700; }
  .bar button.on { background: var(--mint); color: #fff; }
  .prog { width: 80px; height: 4px; border-radius: 99px; background: #e2f6f1; overflow: hidden; }
  .prog i { display: block; height: 100%; width: 0; background: var(--mint); }
</style>
</head>
<body>
<!-- =====================================================================
  설정: 두 현황판 주소와 전환 간격(초)
  이 파일을 저장소의 새 폴더(예: boards)에 올리면 아래 상대 주소 그대로 작동해요.
  주소 끝에 ?t=30 을 붙이면 30초마다 바뀌어요.
====================================================================== -->
<script>
const BOARDS = [
  { name: "멸종위기 동물", url: "../animal/?board" },
  { name: "세계시민",     url: "../global/?board" }
];
const DEFAULT_SECONDS = 20;
</script>

<div id="frames"></div>
<div class="bar" id="bar"></div>

<script>
(() => {
  const q = new URLSearchParams(location.search);
  const sec = Math.max(5, parseInt(q.get("t"), 10) || DEFAULT_SECONDS);
  const frames = BOARDS.map(b => {
    const f = document.createElement("iframe");
    f.src = b.url; f.title = b.name + " 현황판";
    document.getElementById("frames").appendChild(f);
    return f;
  });
  const bar = document.getElementById("bar");
  bar.innerHTML = BOARDS.map((b, i) => `<button data-i="${i}">${b.name}</button>`).join("")
    + `<span class="prog"><i id="prog"></i></span><button id="pause">일시정지</button>`;
  const btns = [...bar.querySelectorAll("button[data-i]")];
  let cur = 0, paused = false, left = sec;

  function show(i){
    cur = (i + frames.length) % frames.length;
    frames.forEach((f, k) => f.classList.toggle("on", k === cur));
    btns.forEach((b, k) => b.classList.toggle("on", k === cur));
    left = sec; draw();
  }
  function draw(){ document.getElementById("prog").style.width = ((sec - left) / sec * 100) + "%"; }

  btns.forEach(b => b.onclick = () => show(+b.dataset.i));
  document.getElementById("pause").onclick = e => {
    paused = !paused; e.target.textContent = paused ? "다시 재생" : "일시정지";
  };
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") show(cur + 1);
    else if (e.key === "ArrowLeft") show(cur - 1);
    else if (e.key === " ") { e.preventDefault(); document.getElementById("pause").click(); }
  });

  setInterval(() => {
    if (paused) return;
    left -= 1; draw();
    if (left <= 0) show(cur + 1);
  }, 1000);

  show(0);
})();
</script>
</body>
</html>

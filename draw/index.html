var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  //---------------------------------------------------------------------
  // QRUtil
  //---------------------------------------------------------------------

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],
      [6, 34],
      [6, 22, 38],
      [6, 24, 42],
      [6, 26, 46],
      [6, 28, 50],

<style>
:root{
  --mint:#14a58c; --mint-2:#0e8a75; --mint-soft:#e2f6f1; --mint-line:#bfe9df; --mint-bg:#f3fbf9;
  --ink:#16302b; --ink-2:#5b716c; --line:#e3ece9;
  --gold:#f2b632; --gold-2:#c98b00; --silver:#7fa7c9;
  color-scheme: light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color:var(--ink);background:radial-gradient(circle at 50% 0,var(--mint-soft) 0,#fff 60%) fixed,#fff;
  -webkit-font-smoothing:antialiased;word-break:keep-all;overflow:hidden;user-select:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;padding:20px 16px 14px}
header{text-align:center}
.kicker{display:inline-block;font-size:14px;font-weight:800;color:var(--mint-2);background:#fff;border:1px solid var(--mint-line);padding:5px 14px;border-radius:99px}
h1{font-size:clamp(28px,4.4vw,48px);font-weight:900;margin-top:8px;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--mint)}
.prizes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.prize{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 14px;font-weight:700;font-size:15px}
.prize b{font-size:13px;color:#fff;border-radius:8px;padding:2px 8px}
.prize .left{font-size:12px;color:var(--ink-2);font-weight:700}

/* machine */
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;width:100%}
.machine{position:relative;width:min(340px,72vw,46vh);aspect-ratio:340/500}
.machine svg{width:100%;height:100%;overflow:visible}
.machine.shake{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-3px,1px) rotate(-1deg)}50%{transform:translate(2px,-1px) rotate(1deg)}75%{transform:translate(-1px,2px) rotate(-.5deg)}}
.knob{transform-origin:170px 392px;transition:transform 1.4s cubic-bezier(.3,.1,.2,1)}
.balls circle{transition:transform .3s}
.machine.shake .balls{animation:jumble .3s ease-in-out infinite alternate}
@keyframes jumble{from{transform:translateY(0)}to{transform:translateY(-6px)}}

.go{margin-top:6px;width:min(340px,80vw);padding:20px;border-radius:22px;background:var(--mint);color:#fff;font-size:26px;font-weight:900;
  box-shadow:0 8px 0 var(--mint-2),0 16px 30px rgba(20,165,140,.3);transition:transform .08s, box-shadow .08s}
.go:active{transform:translateY(6px);box-shadow:0 2px 0 var(--mint-2),0 6px 14px rgba(20,165,140,.3)}
.go[disabled]{opacity:.5;pointer-events:none}
.odds{margin-top:12px;font-size:13px;color:var(--ink-2);text-align:center}
.odds b{color:var(--ink)}

/* capsule flight + result */
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(22,48,43,.35);backdrop-filter:blur(3px);z-index:10}
.overlay.on{display:flex}
.capsule{position:absolute;width:150px;height:150px;left:50%;top:50%;transform:translate(-50%,-50%) scale(.2);transition:transform .7s cubic-bezier(.2,1.4,.4,1)}
.capsule.big{transform:translate(-50%,-50%) scale(1.15)}
.capsule .top,.capsule .bot{position:absolute;left:0;width:150px;height:75px;transition:transform .5s ease-in, opacity .5s}
.capsule .top{top:0;border-radius:75px 75px 0 0}
.capsule .bot{bottom:0;border-radius:0 0 75px 75px;background:#fff;border:4px solid rgba(0,0,0,.08);border-top:0}
.capsule .top{border:4px solid rgba(0,0,0,.08);border-bottom:0}
.capsule .top::after{content:"";position:absolute;left:28px;top:16px;width:34px;height:18px;border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(-25deg)}
.capsule.wobble{animation:wob .18s ease-in-out 4}
@keyframes wob{50%{transform:translate(-50%,-50%) scale(1.15) rotate(8deg)}}
.capsule.open .top{transform:translate(-40px,-120px) rotate(-35deg);opacity:0}
.capsule.open .bot{transform:translate(40px,120px) rotate(30deg);opacity:0}
.tap{position:absolute;left:50%;top:calc(50% + 120px);transform:translateX(-50%);color:#fff;font-weight:900;font-size:20px;opacity:0;transition:opacity .3s;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.tap.on{opacity:1;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.08)}}

.card{position:relative;width:min(460px,92vw);max-height:92vh;overflow:auto;background:#fff;border-radius:28px;padding:26px 24px 22px;text-align:center;
  box-shadow:0 30px 80px rgba(0,0,0,.25);transform:scale(.6);opacity:0;transition:transform .45s cubic-bezier(.2,1.5,.4,1),opacity .3s;display:none}
.card.on{display:block}
.card.show{transform:scale(1);opacity:1}
.rank{display:inline-block;font-size:15px;font-weight:900;color:#fff;border-radius:99px;padding:6px 16px}
.card h2{font-size:clamp(28px,5vw,40px);font-weight:900;margin:12px 0 4px;line-height:1.2}
.card .sub{color:var(--ink-2);font-size:16px}
.trophy{font-size:96px;line-height:1;margin:14px 0 6px;animation:float 2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.char{width:150px;height:150px;object-fit:contain;image-rendering:pixelated;margin:6px auto 2px;display:block;animation:float 2.4s ease-in-out infinite}
.cname{font-weight:900;font-size:18px;color:var(--mint-2)}
.fortune{margin:14px 0 10px;padding:16px 18px;border-radius:18px;background:var(--mint-bg);border:1px dashed var(--mint-line);font-size:18px;line-height:1.6;font-weight:600}
.lucky{display:inline-block;margin:0 0 10px;padding:6px 14px;border-radius:99px;background:#fff6dc;color:#9a6a00;font-weight:800;font-size:14px}
.act{font-size:15px;line-height:1.5;font-weight:800;color:var(--mint-2)}
.act span{color:var(--ink)}
.luck{margin-top:8px;font-size:14px;color:var(--ink-2);font-weight:700}
.luck i{font-style:normal;color:var(--gold)}
.next{margin-top:18px;width:100%;padding:16px;border-radius:16px;background:var(--mint);color:#fff;font-weight:900;font-size:19px}
.staff{margin-top:10px;font-size:13px;color:var(--ink-2)}
.qrshare{display:flex;align-items:center;gap:14px;margin-top:14px;padding:12px;border-radius:16px;border:2px dashed var(--mint-line);text-align:left}
.qrshare #fq{flex:none;width:112px;height:112px}
.qrshare #fq img,.qrshare #fq canvas{width:112px!important;height:112px!important}
.qrshare p{font-size:15px;font-weight:800;color:var(--mint-2);line-height:1.45}
.qrshare p span{display:block;font-size:12.5px;color:var(--ink-2);font-weight:600;margin-top:4px}
body.mine{overflow:auto}
body.mine .wrap,body.mine .gear,body.mine .overlay{display:none}
.mine-page{display:none;min-height:100%;padding:24px 16px 40px;flex-direction:column;align-items:center}
body.mine .mine-page{display:flex}
.mine-page .card{display:block;transform:none;opacity:1;box-shadow:0 14px 40px rgba(20,165,140,.15);max-height:none}
.save{margin-top:14px;width:min(460px,92vw);padding:16px;border-radius:16px;background:var(--mint);color:#fff;font-weight:900;font-size:18px}
.mine-note{margin-top:10px;font-size:13px;color:var(--ink-2);text-align:center;line-height:1.5}
.mine-img{width:min(460px,92vw);margin-top:14px;border-radius:18px;display:none}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:20}

/* admin */
.gear{position:fixed;right:12px;bottom:10px;font-size:12px;color:#b5c7c2;z-index:5}
.adm{position:fixed;inset:0;background:rgba(22,48,43,.4);display:none;align-items:center;justify-content:center;z-index:30}
.adm.on{display:flex}
.panel{width:min(520px,94vw);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:22px;font-size:15px}
.panel h3{font-size:20px;font-weight:900;margin-bottom:12px}
.panel h4{font-size:15px;font-weight:900;margin:16px 0 8px;color:var(--mint-2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field label{display:block;font-size:13px;color:var(--ink-2);font-weight:700;margin-bottom:4px}
.field input{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:16px}
.chk{display:flex;align-items:center;gap:8px;margin-top:8px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats div{background:var(--mint-bg);border-radius:12px;padding:10px 4px;font-size:12px;color:var(--ink-2);font-weight:700}
.stats b{display:block;font-size:22px;color:var(--ink)}
.log{max-height:160px;overflow:auto;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btns button{padding:11px 16px;border-radius:12px;font-weight:800;background:var(--mint-soft);color:var(--mint-2)}

<script>
(() => {
const $ = s => document.querySelector(s);
const KEY = "capsule-draw-v3";
let mem = null;
function load(){
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY) || "null"); } catch(e){ s = mem; }
  if (!s) s = { cfg: {...DEFAULTS}, stock: {1: DEFAULTS.stock1, 2: DEFAULTS.stock2}, log: [] };
  s.cfg = {...DEFAULTS, ...s.cfg};
  return s;
}
function save(){ mem = S; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
let S = load();

/* ---------- random ---------- */
function rand(){ const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 4294967296; }
function draw(){
  const r = rand() * 100, p1 = +S.cfg.p1, p2 = +S.cfg.p2;
  if (r < p1 && S.stock[1] > 0) return 1;
  if (r < p1 + p2 && S.stock[2] > 0) return 2;
  return 3;
}

/* ---------- UI: header + odds ---------- */
function refresh(){
  $("#left1").textContent = S.cfg.showLeft ? `남은 ${S.stock[1]}개` : "";
  $("#left2").textContent = S.cfg.showLeft ? `남은 ${S.stock[2]}개` : "";
  const p3 = Math.max(0, 100 - S.cfg.p1 - S.cfg.p2);
  $("#odds").innerHTML = S.cfg.showOdds
    ? `당첨 확률 <b>1등 ${fmt(S.cfg.p1)}%</b> · <b>2등 ${fmt(S.cfg.p2)}%</b> · <b>3등 ${fmt(p3)}%</b> &nbsp;|&nbsp; 꽝 없이 모두 당첨!`
    : "꽝 없이 모두 당첨!";
}
const fmt = v => (+v).toLocaleString("ko-KR", {maximumFractionDigits: 2});

/* ---------- machine balls ---------- */
const COLORS = ["#f2b632","#14a58c","#e0605a","#7fa7c9","#c2478f","#6f9419","#2a74d0","#f08a1c"];
(function(){
  let g = "";
  const pts = [[110,230],[150,240],[195,236],[235,226],[90,200],[130,205],[172,208],[214,200],[252,196],[112,172],[155,176],[198,170],[240,166],[132,142],[178,140],[220,136],[160,110],[200,104]];
  pts.forEach(([x,y],i) => {
    const c = COLORS[i % COLORS.length];
    g += `<g><circle cx="${x}" cy="${y}" r="22" fill="${c}"/><path d="M${x-22} ${y} A22 22 0 0 0 ${x+22} ${y} Z" fill="#fff"/><circle cx="${x-8}" cy="${y-9}" r="5" fill="#fff" opacity=".6"/></g>`;
  });
  $("#balls").innerHTML = g;
})();

/* ---------- sound ---------- */
let ac = null;
function tone(f, t, d, type = "sine", v = .08){
  if (!S.cfg.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f; o.connect(g); g.connect(ac.destination);
    const s = ac.currentTime + t; g.gain.setValueAtTime(v, s); g.gain.exponentialRampToValueAtTime(.0001, s + d);
    o.start(s); o.stop(s + d + .02);
  } catch(e){}
}
const rattle = () => { for (let i = 0; i < 12; i++) tone(500 + Math.random()*400, i * .1, .05, "square", .03); };
const fanfare = big => { const n = big ? [523,659,784,1047,784,1047] : [523,659,784,1047]; n.forEach((f,i) => tone(f, i * .14, .3, "triangle", .1)); };
const ding = () => { tone(880, 0, .25, "sine", .08); tone(1320, .12, .3, "sine", .06); };

/* ---------- confetti ---------- */
const cv = $("#fx"), cx = cv.getContext("2d"); let parts = [], raf = 0;
function resize(){ cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
addEventListener("resize", resize); resize();
function confetti(n, palette){
  for (let i = 0; i < n; i++) parts.push({x: innerWidth/2, y: innerHeight*.45, vx: (Math.random()-.5)*16, vy: -Math.random()*16-4,
    r: Math.random()*6+4, c: palette[i % palette.length], a: Math.random()*6, va: (Math.random()-.5)*.4, life: 160});
  if (!raf) tick();
}
function tick(){
  cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); cx.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; p.life--;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.a); cx.fillStyle = p.c; cx.globalAlpha = Math.min(1, p.life/40); cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); cx.restore(); });
  parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 40);
  raf = parts.length ? requestAnimationFrame(tick) : (cx.clearRect(0,0,innerWidth,innerHeight), 0);
}

/* ---------- draw flow ---------- */
let busy = false, result = 0, phase = "idle", shareLink = "";
function shareBase(){
  if (SHARE_URL) return SHARE_URL.split("?")[0];
  if (location.protocol.startsWith("http")) return location.origin + location.pathname;
  return "";
}
const CAPCOL = {1: "#f2b632", 2: "#7fa7c9", 3: "#14a58c"};
function start(){
  if (busy) return; busy = true; phase = "rolling";
  $("#go").disabled = true;
  result = draw();
  const knob = $("#knob"); knob.style.transition = "none"; knob.style.transform = "rotate(0deg)";
  requestAnimationFrame(() => { knob.style.transition = ""; knob.style.transform = "rotate(360deg)"; });
  $("#machine").classList.add("shake"); rattle();
  setTimeout(() => {
    $("#machine").classList.remove("shake");
    // record now so a refresh mid-animation can't redo the draw
    if (result !== 3) S.stock[result]--;
    S.log.unshift({t: Date.now(), r: result}); save(); refresh();
    const cap = $("#cap"); cap.className = "capsule"; $("#capTop").style.background = COLORS[Math.floor(rand() * COLORS.length)];
    $("#card").className = "card"; $("#ov").classList.add("on");
    requestAnimationFrame(() => requestAnimationFrame(() => cap.classList.add("big")));
    setTimeout(() => { $("#tap").classList.add("on"); phase = "capsule"; }, 650);
  }, 1500);
}
function openCap(){
  if (phase !== "capsule") return; phase = "opening";
  $("#tap").classList.remove("on");
  const cap = $("#cap"); cap.classList.add("wobble"); tone(300, 0, .1, "square", .04);
  setTimeout(() => { cap.classList.remove("wobble"); cap.classList.add("open"); showCard(); }, 760);
}
function showCard(){
  const card = $("#card"); let h = "";
  if (result === 1){
    h = `<span class="rank" style="background:var(--gold)">1등 당첨</span>
      <div class="trophy">🏆</div><h2>스탠리 텀블러!</h2>
      <p class="sub">${fmt(S.cfg.p1)}%의 기적을 뽑았어요!<br>지구를 위한 텀블러, 오래오래 써 주세요.</p>
      <p class="staff">부스 선생님께 이 화면을 보여 주세요</p>`;
    confetti(220, ["#f2b632","#ffd76a","#14a58c","#fff","#e0605a"]); fanfare(true);

      <div class="fortune">${f.t}</div>

      ${shareLink ? `<div class="qrshare"><div id="fq"></div><p>휴대폰 카메라로 찍으면<br>내 운세를 가져갈 수 있어요!<span>이미지로 저장하거나 친구에게 공유해 보세요</span></p></div>` : ""}`;

  requestAnimationFrame(() => requestAnimationFrame(() => card.classList.add("show")));
  $("#next").onclick = reset;
  phase = "card";
}

/* ---------- 학생 휴대폰: 내 운세 보기·저장 ---------- */
function josa(n){ return ((n.charCodeAt(n.length-1)-0xAC00)%28) ? "이" : "가"; }
function wrapText(ctx, text, maxW){
  const words = text.split(" "), lines = []; let line = "";
  words.forEach(w => {
    const t = line ? line + " " + w : w;
    if (ctx.measureText(t).width <= maxW) { line = t; return; }
    if (line) lines.push(line);
    line = w;
    while (ctx.measureText(line).width > maxW) { let i = line.length; while (i > 1 && ctx.measureText(line.slice(0, i)).width > maxW) i--; lines.push(line.slice(0, i)); line = line.slice(i); }
  });
  if (line) lines.push(line);
  return lines;
}
function rr(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
async function makeImage(f, stars){
  try { await document.fonts.ready; } catch(e){}
  const W = 1080, H = 1350, c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d"), FF = '"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  const g = x.createLinearGradient(0,0,0,H); g.addColorStop(0,"#d9f4ec"); g.addColorStop(1,"#ffffff"); x.fillStyle = g; x.fillRect(0,0,W,H);
  x.fillStyle = "#fff"; x.shadowColor = "rgba(20,165,140,.18)"; x.shadowBlur = 40; rr(x,70,90,W-140,H-200,48); x.fill(); x.shadowBlur = 0;
  x.textAlign = "center"; x.textBaseline = "middle";
  x.fillStyle = "#14a58c"; rr(x,W/2-250,140,500,74,37); x.fill();
  x.fillStyle = "#fff"; x.font = `900 36px ${FF}`; x.fillText("2027 고교 생활 운세", W/2, 178);
  const img = new Image(); img.src = IMG[f.c]; await img.decode().catch(()=>{});
  x.imageSmoothingEnabled = false; const s = 300 / Math.max(img.width || 1, img.height || 1);
  x.drawImage(img, W/2 - img.width*s/2, 250 + (300 - img.height*s)/2, img.width*s, img.height*s); x.imageSmoothingEnabled = true;
  x.fillStyle = "#0e8a75"; x.font = `900 42px ${FF}`; x.fillText(`${f.c}${josa(f.c)} 본 나의 고1 생활`, W/2, 600);
  x.font = `700 44px ${FF}`; const lines = wrapText(x, f.t, W - 380);
  const boxH = lines.length * 66 + 70; x.fillStyle = "#f3fbf9"; rr(x,130,650,W-260,boxH,30); x.fill();
  x.setLineDash([12,10]); x.strokeStyle = "#bfe9df"; x.lineWidth = 3; rr(x,130,650,W-260,boxH,30); x.stroke(); x.setLineDash([]);
  x.fillStyle = "#16302b"; lines.forEach((l,i) => x.fillText(l, W/2, 650 + 35 + 33 + i*66));
  let y = 650 + boxH + 70;
  x.font = `800 36px ${FF}`; const kw = x.measureText(f.k).width + 60;
  x.fillStyle = "#fff6dc"; rr(x,W/2-kw/2,y-34,kw,68,34); x.fill(); x.fillStyle = "#9a6a00"; x.fillText(f.k, W/2, y);
  y += 90; x.font = `800 34px ${FF}`; x.fillStyle = "#0e8a75";
  wrapText(x, "선배의 꿀팁 · " + f.a, W - 300).forEach((l,i) => x.fillText(l, W/2, y + i*50));
  y += 50 * wrapText(x, "선배의 꿀팁 · " + f.a, W - 300).length + 30;
  x.font = `700 30px ${FF}`; x.fillStyle = "#5b716c"; x.fillText("고교 행운 지수", W/2, y);
  x.font = `800 48px ${FF}`; x.fillStyle = "#f2b632"; x.fillText("★".repeat(stars) + "☆".repeat(5 - stars), W/2, y + 56);
  x.font = `700 28px ${FF}`; x.fillStyle = "#5b716c"; x.fillText("민주시민·세계시민 부스 · 행운 캡슐 뽑기", W/2, H - 70);
  return new Promise(res => c.toBlob(res, "image/png"));
}
function mineMode(){

  const f = FORTUNES[fi]; if (!f) return false;

        $("#mineImg").src = url; $("#mineImg").style.display = "block";

      }
    } catch(e){ $("#mineNote").textContent = "저장이 안 되면 화면을 캡처해서 간직하세요!"; }
    btn.disabled = false; btn.textContent = "이미지로 저장 · 공유하기";
  };
  return true;
}
if (!mineMode()) refresh();

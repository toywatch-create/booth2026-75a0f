<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>나와 닮은 멸종위기 동물 찾기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --mint:#14a58c; --mint-2:#0e8a75; --mint-soft:#e2f6f1; --mint-line:#bfe9df; --mint-bg:#f3fbf9;
  --ink:#16302b; --ink-2:#5b716c; --line:#e3ece9; --card:#fff;
  --ok:#14a58c; --bad:#e0605a;
  color-scheme: light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;word-break:keep-all;line-height:1.55}
body:not(.board){background:linear-gradient(180deg,var(--mint-soft) 0,#fff 340px) no-repeat,#fff}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit}
.app{max-width:480px;margin:0 auto;min-height:100%;padding:20px 16px 40px;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;animation:fade .35s ease}
.screen.on{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:24px;padding:22px 20px;border:1px solid var(--line);box-shadow:0 10px 30px rgba(20,165,140,.08)}
.btn{display:block;width:100%;padding:16px;border-radius:16px;background:var(--mint);color:#fff;font-weight:800;font-size:17px;
  box-shadow:0 6px 16px rgba(20,165,140,.28);transition:transform .1s, background .15s}
.btn:active{transform:scale(.98);background:var(--mint-2)}
.btn.ghost{background:#fff;color:var(--mint-2);border:2px solid var(--mint-line);box-shadow:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.chip{display:inline-block;padding:5px 12px;border-radius:999px;background:var(--mint-soft);color:var(--mint-2);font-size:13px;font-weight:700}
.ico{display:inline-block;vertical-align:middle;flex:none}

/* intro */
.hero{text-align:center;padding:14px 4px 4px}
.hero .kicker{display:inline-block;font-size:13px;font-weight:800;color:var(--mint-2);background:#fff;border:1px solid var(--mint-line);padding:5px 12px;border-radius:99px}
.hero h1{font-size:31px;line-height:1.25;margin:14px 0 10px;font-weight:900;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--mint)}
.hero p{color:var(--ink-2);font-size:16px}
.parade{display:flex;justify-content:center;flex-wrap:wrap;gap:5px;margin:18px auto 4px;max-width:360px}
.parade .ico{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.steps{margin:18px 0;display:grid;gap:8px}
.step{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 16px}
.step b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--mint-soft);color:var(--mint-2);display:grid;place-items:center;font-size:14px}
.spacer{flex:1}

/* question */
.prog{height:10px;background:var(--mint-soft);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;background:var(--mint);border-radius:99px;transition:width .3s}
.qnum{font-size:14px;font-weight:800;color:var(--mint-2);margin-top:14px}
.qtext{font-size:23px;font-weight:800;line-height:1.38;margin:8px 0 22px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:18px;
  padding:18px 16px;margin-bottom:12px;font-size:17px;font-weight:600;transition:border-color .15s, transform .1s, background .15s}
.opt:active{transform:scale(.98)}
.opt.sel{border-color:var(--mint);background:var(--mint-soft)}
.opt .em{font-size:28px;flex:none;width:44px;height:44px;border-radius:14px;background:var(--mint-bg);display:grid;place-items:center}
.back{align-self:flex-start;color:var(--ink-2);font-size:14px;padding:6px 0}

/* result */
.rart{display:flex;justify-content:center;margin:-2px 0 8px}
.rtitle{text-align:center}
.rtitle .nick{font-size:15px;font-weight:800}
.rtitle h2{font-size:32px;font-weight:900;margin:2px 0 6px}
.rtitle p{color:var(--ink-2)}
.traits{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0 4px}
.compass-wrap{margin:18px 0 10px}
.compass-wrap > svg{width:100%;height:auto;display:block}
.sec-title{font-size:15px;font-weight:800;margin-bottom:8px}

/* tiebreak */
.tb{display:grid;gap:12px;margin-top:8px}

/* learn */
.lcard{flex:1;display:flex;flex-direction:column}
.lhead{display:flex;align-items:center;gap:10px}
.lcard .pg{font-size:13px;font-weight:800;color:var(--mint-2)}
.lcard h3{font-size:24px;line-height:1.32;margin:12px 0 14px;font-weight:900}
.lcard .body{font-size:17px;line-height:1.75}
.lcard .body p{margin-bottom:12px}
.lcard .body b{background:linear-gradient(transparent 58%, #c9f0e6 58%)}
.fact{margin-top:6px;padding:14px 16px;border-radius:14px;background:var(--mint-soft);color:var(--mint-2);font-weight:800;font-size:16px}
.src{margin-top:12px;font-size:12px;color:var(--ink-2)}
.dots{display:flex;gap:6px;justify-content:center;margin:16px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--mint-line)}
.dots i.on{background:var(--mint);width:22px;border-radius:99px}

/* quiz */
.qopt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:10px;font-size:17px;font-weight:600}
.qopt.right{border-color:var(--ok);background:var(--mint-soft)}
.qopt.wrong{border-color:var(--bad);background:#fdf0ef;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{min-height:52px;font-weight:800;font-size:15px;margin:4px 0 12px}
.fb.ok{color:var(--mint-2)} .fb.no{color:var(--bad)}

/* done */
.stampwrap{position:relative;width:170px;height:170px;margin:6px auto 12px}
.stamp{position:absolute;inset:0;border-radius:50%;border:6px double var(--mint);color:var(--mint);display:grid;place-items:center;
  font-weight:900;font-size:22px;transform:rotate(-12deg);animation:stamp .5s cubic-bezier(.2,1.6,.4,1);background:#fff}
.stamp .ico{margin-top:-6px}
@keyframes stamp{from{transform:scale(2.2) rotate(-12deg);opacity:0}to{transform:scale(1) rotate(-12deg);opacity:1}}
.namein{width:100%;padding:16px;font-size:18px;border:2px solid var(--line);border-radius:16px;margin:10px 0;text-align:center;outline:none}
.namein:focus{border-color:var(--mint)}
.toast{margin-top:10px;text-align:center;font-weight:800;min-height:24px}

/* board */
body.board{background:var(--mint-bg);overflow:hidden}
body.board .app{display:none}
.bwrap{display:none}
body.board .bwrap{display:grid;grid-template-columns:auto minmax(0,1fr) 250px;gap:20px;height:100vh;padding:20px}
body.board.nomap .bwrap{grid-template-columns:auto minmax(0,1fr)}
body.board.nomap .bmap{display:none}
.panel{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 30px rgba(20,165,140,.08);min-height:0}
.bmain{display:flex;align-items:center;justify-content:center;padding:14px;aspect-ratio:1/1;height:calc(100vh - 40px)}
.bmain > svg{width:100%;height:100%}
.bmap{display:flex;flex-direction:column;padding:16px 16px 10px}
.bmap h2{font-size:18px;font-weight:900}
.bmap .sub{font-size:13px;color:var(--ink-2)}
.bmap .mapsvg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.mapsvg > svg{width:100%;height:100%;max-width:100%;max-height:100%}
.bside{display:flex;flex-direction:column;gap:14px;min-height:0}
.bside .head{padding:18px}
.bside h1{font-size:22px;line-height:1.25;font-weight:900}
.bside .sub{color:var(--ink-2);margin-top:4px}
.qrbox{padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.qrbox #qr img,.qrbox #qr canvas{width:150px!important;height:150px!important}
.qrbox p{font-weight:900;font-size:17px;line-height:1.35;color:var(--mint-2)}
.bcount{padding:16px 20px;color:var(--ink-2);font-weight:700}
.bcount b{font-size:46px;color:var(--mint);display:block;line-height:1.05;font-weight:900}
.legend{display:grid;gap:7px;overflow:auto;min-height:0;padding:16px 18px}
.lg{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700}
.lg .bar{flex:1;height:8px;border-radius:99px;background:var(--mint-soft);overflow:hidden}
.lg .bar i{display:block;height:100%}
.lg .n{width:28px;text-align:right;font-weight:900}
.bmode{font-size:12px;color:#c07a12;padding:0 6px}
.gear{position:fixed;right:14px;bottom:10px;color:#a9bdb8;font-size:13px}
.adm{position:fixed;right:14px;bottom:36px;background:#fff;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.12);border-radius:14px;padding:14px;display:none;width:260px;font-size:14px}
.adm.on{display:block}
.adm input{width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);margin:6px 0}
.adm button{padding:8px 10px;border-radius:8px;background:var(--mint-soft);color:var(--mint-2);font-weight:700;margin:4px 4px 0 0}
.adm button.danger{background:#fdeceb;color:#c0443e}
body.deleting .pt{cursor:pointer}
body.deleting .pt:hover circle{stroke:#e0605a;stroke-width:.1}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.7)}100%{transform:scale(1)}}
.pt.new circle,.pin.new .pinart{transform-box:fill-box;transform-origin:center;animation:pop .7s ease}
@media (max-width:1100px){body.board{overflow:auto} body.board .bwrap{grid-template-columns:1fr;height:auto} .bmain{height:auto;width:100%}}
</style>
</head>
<body>
<div class="app">

  <!-- intro -->
  <section class="screen on" id="s-intro">
    <div class="hero">
      <span class="kicker" id="i-kicker"></span>
      <h1 id="i-title"></h1>
      <p id="i-sub"></p>
      <div class="parade" id="i-parade"></div>
    </div>
    <div class="steps">
      <div class="step"><b>1</b><div><strong>10가지 질문</strong>에 답하고 나의 유형 찾기</div></div>
      <div class="step"><b>2</b><div>내 유형과 연결된 <strong>이야기 카드</strong> 읽기</div></div>
      <div class="step"><b>3</b><div><strong>미션 퀴즈 3문제</strong> 풀고 도장 받기</div></div>
      <div class="step"><b>4</b><div>좌표 보드에 <strong>내 이름</strong> 올리기</div></div>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="startBtn">시작하기</button>
  </section>

  <!-- question -->
  <section class="screen" id="s-q">
    <button class="back" id="qBack">← 이전</button>
    <div class="prog"><i id="qProg"></i></div>
    <div class="qnum" id="qNum"></div>
    <div class="qtext" id="qText"></div>
    <div id="qOpts"></div>
  </section>

  <!-- tiebreak -->
  <section class="screen" id="s-tb">
    <div class="qnum">마지막 질문</div>
    <div class="qtext">두 유형의 경계에 딱 서 있어요!<br>둘 중 더 궁금한 이야기는?</div>
    <div class="tb" id="tbOpts"></div>
  </section>

  <!-- result -->
  <section class="screen" id="s-res">
    <div class="card">
      <div class="rtitle">
        <div class="rart" id="rArt"></div>
        <div class="nick" id="rNick"></div>
        <h2 id="rName"></h2>
        <p id="rTag"></p>
      </div>
      <div class="traits" id="rTraits"></div>
      <div class="compass-wrap" id="rCompass"></div>
      <p class="small muted" style="text-align:center" id="rAxis"></p>
    </div>
    <div style="height:16px"></div>
    <button class="btn" id="toLearn">이야기 카드 보러 가기 →</button>
  </section>

  <!-- learn -->
  <section class="screen" id="s-learn">
    <div class="card lcard">
      <div class="lhead"><span id="lArt"></span><div class="pg" id="lPg"></div></div>
      <h3 id="lH"></h3>
      <div class="body" id="lBody"></div>
      <div class="spacer"></div>
      <div class="src" id="lSrc"></div>
    </div>
    <div class="dots" id="lDots"></div>
    <div class="row">
      <button class="btn ghost" id="lPrev" style="flex:1">이전</button>
      <button class="btn" id="lNext" style="flex:2">다음</button>
    </div>
  </section>

  <!-- quiz -->
  <section class="screen" id="s-quiz">
    <div class="prog"><i id="zProg"></i></div>
    <div class="qnum" id="zNum"></div>
    <div class="qtext" id="zText"></div>
    <div id="zOpts"></div>
    <div class="fb" id="zFb"></div>
    <div class="spacer"></div>
    <button class="btn ghost" id="zPeek">카드 다시 보기</button>
  </section>

  <!-- done -->
  <section class="screen" id="s-done">
    <div class="card" style="text-align:center">
      <div class="stampwrap"><div class="stamp" id="dStamp"></div></div>
      <h2 style="font-size:24px;font-weight:900" id="dTitle"></h2>
      <p class="muted" style="margin:6px 0 4px">부스 선생님께 이 화면을 보여주고<br>상품을 받으세요!</p>
      <p class="small muted" id="dTime"></p>
    </div>
    <div style="height:16px"></div>
    <div class="card">
      <div class="sec-title">좌표 보드에 이름 올리기</div>
      <p class="small muted">별명도 괜찮아요. (최대 8글자)</p>
      <input class="namein" id="dName" maxlength="8" placeholder="이름 또는 별명" autocomplete="off">
      <button class="btn" id="dSend">보드에 올리기</button>
      <div class="toast" id="dToast"></div>
    </div>
    <div style="height:12px"></div>
    <button class="btn ghost" id="dAgain">처음부터 다시 하기</button>
  </section>
</div>

<!-- board -->
<div class="bwrap">
  <div class="panel bmain" id="bMain"></div>
  <div class="panel bmap" id="bMapPanel">
    <h2 id="bMapTitle"></h2>
    <div class="sub" id="bMapSub"></div>
    <div class="mapsvg" id="bMap"></div>
  </div>
  <div class="bside">
    <div class="panel head">
      <h1 id="bTitle"></h1>
      <div class="sub" id="bSub"></div>
    </div>
    <div class="panel qrbox"><div id="qr"></div><p>휴대폰으로 QR을 찍고<br>참여하세요!</p></div>
    <div class="panel bcount"><b id="bTotal">0</b>명 참여</div>
    <div class="panel legend" id="bLegend"></div>
    <div class="bmode" id="bMode"></div>
  </div>
  <button class="gear" id="gear">관리</button>
  <div class="adm" id="adm">
    <div id="admLock">
      관리자 PIN
      <input type="password" id="admPin" inputmode="numeric">
      <button id="admGo">확인</button>
    </div>
    <div id="admTools" style="display:none">
      <div>점을 클릭하면 삭제됩니다.</div>
      <button id="admReset" class="danger">전체 초기화</button>
      <button id="admClose">닫기</button>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   설정 (배포 전에 여기만 바꾸면 됩니다)
   FIREBASE_URL : Firebase Realtime Database 주소
                  예) "https://my-booth-default-rtdb.asia-southeast1.firebasedatabase.app"
                  비워두면 이 기기 안에만 저장됩니다(보드도 같은 기기·브라우저에서만 보임).
   ADMIN_PIN    : 보드 화면의 '관리' 버튼 PIN (점 삭제, 전체 초기화)
   ===================================================================== */
const FIREBASE_URL = "";
const ADMIN_PIN = "0000";
</script>
<script>

<script>
(() => {
const D = DATA;
const ART = D.art || {};
const ROOM = D.room;
const SECTORS = ["ENE","NNE","NNW","WNW","WSW","SSW","SSE","ESE"];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- icons (illustration or emoji badge) ---------- */
let clipN = 0;
function iconInner(key){
  const t = D.types[key], id = "c" + (++clipN);
  if (D.img && D.img[key]) {
    return `<defs><clipPath id="${id}"><circle cx="50" cy="50" r="50"/></clipPath></defs>
      <circle cx="50" cy="50" r="50" fill="${t.color}" fill-opacity=".16"/>
      <g clip-path="url(#${id})"><image href="${D.img[key]}" x="6" y="6" width="88" height="88" preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated"/></g>`;
  }
  if (ART[key]) {
    return `<defs><clipPath id="${id}"><circle cx="50" cy="50" r="50"/></clipPath></defs>
      <circle cx="50" cy="50" r="50" fill="${t.color}" fill-opacity=".16"/>
      <g clip-path="url(#${id})">${ART[key]}</g>`;
  }
  return `<circle cx="50" cy="50" r="50" fill="${t.color}" fill-opacity=".16"/>
    <text x="50" y="54" text-anchor="middle" dominant-baseline="central" font-size="54">${esc(t.icon)}</text>`;
}
function icon(key, size, ring){
  const t = D.types[key];
  return `<svg class="ico" width="${size}" height="${size}" viewBox="-4 -4 108 108" aria-hidden="true">
    ${ring ? `<circle cx="50" cy="50" r="52" fill="#fff" stroke="${t.color}" stroke-width="4"/>` : ""}${iconInner(key)}</svg>`;
}
function iconAt(key, cx, cy, size, ring){
  const t = D.types[key];
  return `<svg x="${cx - size/2}" y="${cy - size/2}" width="${size}" height="${size}" viewBox="-6 -6 112 112" overflow="visible">
    ${ring !== false ? `<circle cx="50" cy="50" r="53" fill="#fff" stroke="${t.color}" stroke-width="5"/>` : ""}${iconInner(key)}</svg>`;
}

/* ---------- geometry ---------- */
function sectorOf(x, y){
  const a = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  return SECTORS[Math.min(7, Math.floor(a / 45))];
}
function tieCandidates(x, y){
  if (x > 0 && y > 0) return ["NNE","ENE"];
  if (x < 0 && y > 0) return ["NNW","WNW"];
  if (x < 0 && y < 0) return ["SSW","WSW"];
  return ["SSE","ESE"];
}
const round = v => Math.round(v * 100) / 100;
function placePoint(x, y, type){
  for (let i = 0; i < 80; i++){
    const px = x + (Math.random() * 1.6 - 0.8), py = y + (Math.random() * 1.6 - 0.8);
    if (Math.abs(px) < 5.6 && Math.abs(py) < 5.6 && sectorOf(px, py) === type) return [round(px), round(py)];
  }
  const k = SECTORS.indexOf(type), a = (k * 45 + 22.5) * Math.PI / 180, r = Math.max(1, Math.hypot(x, y));
  return [round(Math.cos(a) * r), round(Math.sin(a) * r)];
}

/* ---------- compass SVG ---------- */
function compassSVG(opts){
  const R = 6;
  const P = i => [[R,0],[R,R],[0,R],[-R,R],[-R,0],[-R,-R],[0,-R],[R,-R]][((i % 8) + 8) % 8];
  let wedges = "", labels = "";
  SECTORS.forEach((s, k) => {
    const t = D.types[s], a = P(k), b = P(k + 1), hi = opts.highlight === s;
    wedges += `<polygon points="0,0 ${a[0]},${-a[1]} ${b[0]},${-b[1]}" fill="${t.color}" fill-opacity="${hi ? .28 : .08}"/>`;
    const ang = (k * 45 + 22.5) * Math.PI / 180, lr = opts.labelR || 4.4;
    const lx = Math.cos(ang) * lr, ly = -Math.sin(ang) * lr, sz = opts.iconSize || 1.15, fs = opts.labelSize || .4;
    labels += `<g opacity="${opts.highlight && !hi ? .5 : 1}">
      ${iconAt(s, lx, ly - sz * .32, sz)}
      <text x="${lx}" y="${ly + sz * .5}" text-anchor="middle" dominant-baseline="central" font-size="${fs}" font-weight="800" fill="#16302b"
        stroke="#fff" stroke-width="${fs * .3}" paint-order="stroke">${esc(t.name)}</text>
    </g>`;
  });
  const line = "#cfe3de", txt = "#5b716c";
  let diag = "";
  [[R,R],[-R,R]].forEach(([x,y]) => diag += `<line x1="${-x}" y1="${y}" x2="${x}" y2="${-y}" stroke="${line}" stroke-width=".035" stroke-dasharray=".14 .14"/>`);
  const ax = D.axes, af = opts.axisSize || .34;
  const axes = `
    <line x1="${-R}" y1="0" x2="${R}" y2="0" stroke="#a9d8cc" stroke-width=".06"/>
    <line x1="0" y1="${-R}" x2="0" y2="${R}" stroke="#a9d8cc" stroke-width=".06"/>
    <text x="${R-0.15}" y="-.2" text-anchor="end" font-size="${af}" font-weight="800" fill="${txt}">${esc(ax.x[1])} →</text>
    <text x="${-R+0.15}" y="-.2" text-anchor="start" font-size="${af}" font-weight="800" fill="${txt}">← ${esc(ax.x[0])}</text>
    <text x=".18" y="${-R+0.5}" font-size="${af}" font-weight="800" fill="${txt}">↑ ${esc(ax.y[1])}</text>
    <text x=".18" y="${R-0.25}" font-size="${af}" font-weight="800" fill="${txt}">↓ ${esc(ax.y[0])}</text>`;
  return `<svg viewBox="${-R} ${-R} ${2*R} ${2*R}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(D.boardTitle)} 좌표">
    <rect x="${-R}" y="${-R}" width="${2*R}" height="${2*R}" rx=".5" fill="#fff"/>
    ${wedges}${diag}${axes}${labels}<g id="pts">${opts.points || ""}</g></svg>`;
}

/* ---------- Korea map ---------- */
function mapSVG(counts, fresh){
  const M = D.map;
  let pins = "";
  SECTORS.forEach(s => {
    const h = D.types[s].habitat; if (!h) return;
    const [px, py] = M.pts[s], [ix, iy] = h.at, t = D.types[s], n = counts[s] || 0;
    pins += `<g class="pin${fresh.has(s) ? " new" : ""}">
      <line x1="${px}" y1="${py}" x2="${ix}" y2="${iy}" stroke="${t.color}" stroke-width="2" stroke-dasharray="3 3"/>
      <circle cx="${px}" cy="${py}" r="5" fill="${t.color}" stroke="#fff" stroke-width="2"/>
      <g class="pinart">${iconAt(s, ix, iy, 60)}</g>
      <g transform="translate(${ix + 20} ${iy - 22})">
        <rect x="-13" y="-10" width="26" height="20" rx="10" fill="${n ? t.color : "#c9d6d2"}"/>
        <text x="0" y="1" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="900" fill="#fff">${n}</text>
      </g>
      <text x="${ix}" y="${iy + 40}" text-anchor="middle" font-size="12.5" font-weight="900" fill="#16302b" stroke="#fff" stroke-width="3.5" paint-order="stroke">${esc(t.name)}</text>
      <text x="${ix}" y="${iy + 55}" text-anchor="middle" font-size="11" font-weight="700" fill="#5b716c" stroke="#fff" stroke-width="3" paint-order="stroke">${esc(h.place)}</text>
    </g>`;
  });
  const [dx, dy] = M.pts.dokdo;
  return `<svg viewBox="0 0 ${M.w} ${M.h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="우리나라 지도와 동물 서식지">
    <defs><clipPath id="mapclip"><rect width="${M.w}" height="${M.h}"/></clipPath></defs>
    <g clip-path="url(#mapclip)">
      <path d="${M.kp}" fill="#eef3f1" stroke="#dce7e3" stroke-width="1"/>
      <path d="${M.kr}" fill="#d3f1e8" stroke="#7fcfba" stroke-width="1.2" stroke-linejoin="round"/>
    </g>
    <circle cx="${dx}" cy="${dy}" r="2.6" fill="#7fcfba"/>
    <text x="${dx - 2}" y="${dy + 14}" text-anchor="middle" font-size="10" font-weight="800" fill="#0e8a75">독도</text>
    ${pins}</svg>`;
}

/* ---------- storage ---------- */
let mem = {};
const LS = {
  get(){ try { return JSON.parse(localStorage.getItem("booth:" + ROOM) || "{}"); } catch(e){ return mem; } },
  set(v){ mem = v; try { localStorage.setItem("booth:" + ROOM, JSON.stringify(v)); } catch(e){} }
};
let bc = null; try { bc = new BroadcastChannel("booth:" + ROOM); } catch(e){}
const Store = {
  remote: !!FIREBASE_URL,
  base(){ return FIREBASE_URL.replace(/\/+$/, "") + "/" + ROOM + "/entries"; },
  async add(entry){
    if (this.remote){
      const r = await fetch(this.base() + ".json", {method:"POST", body: JSON.stringify(entry)});
      if (!r.ok) throw new Error("save " + r.status);
      return;
    }
    const all = LS.get(); all["l" + Date.now() + Math.random().toString(36).slice(2,6)] = entry; LS.set(all);
    if (bc) bc.postMessage("u");
  },
  async all(){
    if (this.remote){
      const r = await fetch(this.base() + ".json", {cache:"no-store"});
      if (!r.ok) throw new Error("load " + r.status);
      return (await r.json()) || {};
    }
    return LS.get();
  },
  async del(id){
    if (this.remote){ await fetch(this.base() + "/" + encodeURIComponent(id) + ".json", {method:"DELETE"}); return; }
    const all = LS.get(); delete all[id]; LS.set(all); if (bc) bc.postMessage("u");
  },
  async reset(){
    if (this.remote){ await fetch(this.base() + ".json", {method:"DELETE"}); return; }
    LS.set({}); if (bc) bc.postMessage("u");
  }
};

/* ---------- name filter ---------- */
const BAD = ["씨발","시발","ㅅㅂ","ㅆㅂ","병신","ㅂㅅ","개새","새끼","좆","존나","ㅈㄴ","미친","지랄","fuck","shit","bitch"];
function cleanName(s){
  s = (s || "").replace(/\s+/g, " ").trim().slice(0, 8);
  const flat = s.toLowerCase().replace(/[^가-힣ㄱ-ㅎa-z]/g, "");
  if (BAD.some(w => flat.includes(w))) return null;
  return s;
}

/* =================== PARTICIPANT APP =================== */
const st = { qi:0, ans:[], x:0, y:0, type:null, li:0, zi:0, done:false, sent:false };

function show(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
  $("#" + id).classList.add("on");
  window.scrollTo(0, 0);
}

function initApp(){
  document.title = D.title;
  $("#i-kicker").textContent = D.kicker;
  $("#i-title").innerHTML = D.titleHTML;
  $("#i-sub").textContent = D.subtitle;
  $("#i-parade").innerHTML = SECTORS.map((s, i) => icon(s, 38, true).replace('class="ico"', `class="ico" style="animation-delay:${i * .15}s"`)).join("");
  $("#startBtn").onclick = () => { st.qi = 0; st.ans = []; renderQ(); show("s-q"); };
  $("#qBack").onclick = () => {
    if (st.qi === 0){ show("s-intro"); return; }
    st.qi--; st.ans.pop(); renderQ();
  };
  $("#toLearn").onclick = () => { st.li = 0; renderLearn(); show("s-learn"); };
  $("#lPrev").onclick = () => { if (st.li > 0){ st.li--; renderLearn(); } else show("s-res"); };
  $("#lNext").onclick = () => {
    const L = D.types[st.type].learn;
    if (st.li < L.length - 1){ st.li++; renderLearn(); }
    else if (st.done) show("s-done");
    else if (st.zi > 0) show("s-quiz");
    else startQuiz();
  };
  $("#zPeek").onclick = () => { st.li = 0; renderLearn(); show("s-learn"); };
  $("#dSend").onclick = sendName;
  $("#dName").addEventListener("keydown", e => { if (e.key === "Enter") sendName(); });
  $("#dAgain").onclick = () => { Object.assign(st, {qi:0, ans:[], x:0, y:0, type:null, li:0, zi:0, done:false, sent:false}); $("#dName").value=""; $("#dToast").textContent=""; $("#dSend").disabled=false; show("s-intro"); };
}

function renderQ(){
  const Q = D.questions[st.qi];
  $("#qProg").style.width = (st.qi / D.questions.length * 100) + "%";
  $("#qNum").textContent = `Q${st.qi + 1} / ${D.questions.length}`;
  $("#qText").textContent = Q.q;
  const box = $("#qOpts"); box.innerHTML = "";
  [Q.a, Q.b].forEach(o => {
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = `<span class="em">${o.e}</span><span>${esc(o.t)}</span>`;
    b.onclick = () => {
      if (box.dataset.lock) return; box.dataset.lock = 1;
      b.classList.add("sel");
      st.ans.push({axis: Q.axis, v: o.v});
      setTimeout(() => { delete box.dataset.lock; next(); }, 260);
    };
    box.appendChild(b);
  });
}
function next(){
  st.qi++;
  if (st.qi < D.questions.length){ renderQ(); return; }
  st.x = st.ans.filter(a => a.axis === "x").reduce((s, a) => s + a.v, 0);
  st.y = st.ans.filter(a => a.axis === "y").reduce((s, a) => s + a.v, 0);
  if (Math.abs(st.x) === Math.abs(st.y)) { renderTie(); show("s-tb"); }
  else { finishType(sectorOf(st.x, st.y)); }
}
function renderTie(){
  const box = $("#tbOpts"); box.innerHTML = "";
  tieCandidates(st.x, st.y).forEach(s => {
    const t = D.types[s];
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = `${icon(s, 56, true)}<strong>${esc(t.teaser)}</strong>`;
    b.onclick = () => finishType(s);
    box.appendChild(b);
  });
}
function finishType(s){
  st.type = s; st.zi = 0; st.done = false; st.sent = false;
  const t = D.types[s];
  [st.px, st.py] = placePoint(st.x, st.y, s);
  $("#rArt").innerHTML = icon(s, 150, true);
  $("#rNick").textContent = t.nick; $("#rNick").style.color = t.color;
  $("#rName").textContent = t.name;
  $("#rTag").innerHTML = esc(t.tagline) + (t.char ? `<br><span class="chip" style="margin-top:8px">${esc(D.charLabel || "나의 친구")} · ${esc(t.char)}</span>` : "");
  $("#rTraits").innerHTML = t.traits.map(x => `<span class="chip">#${esc(x)}</span>`).join("");
  const me = `<g><circle cx="${st.px}" cy="${-st.py}" r=".3" fill="${t.color}" stroke="#fff" stroke-width=".1"/>
    <text x="${st.px}" y="${-st.py - .5}" text-anchor="middle" font-size=".42" font-weight="900" fill="#16302b" stroke="#fff" stroke-width=".12" paint-order="stroke">나</text></g>`;
  $("#rCompass").innerHTML = compassSVG({highlight: s, points: me});
  const xl = st.x > 0 ? D.axes.x[1] : D.axes.x[0], yl = st.y > 0 ? D.axes.y[1] : D.axes.y[0];
  $("#rAxis").textContent = `${xl} ${Math.abs(st.x)}점 · ${yl} ${Math.abs(st.y)}점`;
  show("s-res");
}

function renderLearn(){
  const t = D.types[st.type], L = t.learn, c = L[st.li];
  $("#lArt").innerHTML = icon(st.type, 44, true);
  $("#lPg").textContent = `${t.name} 이야기 ${st.li + 1} / ${L.length}`;
  $("#lH").textContent = c.h;
  $("#lBody").innerHTML = c.body.map(p => `<p>${p}</p>`).join("") + (c.fact ? `<div class="fact">${c.fact}</div>` : "");
  $("#lSrc").textContent = c.src ? "출처: " + c.src : "";
  $("#lDots").innerHTML = L.map((_, i) => `<i class="${i === st.li ? "on" : ""}"></i>`).join("");
  const last = st.li === L.length - 1, inQuiz = st.zi > 0 && !st.done;
  $("#lNext").textContent = last ? (st.done ? "완료 화면으로" : inQuiz ? "퀴즈로 돌아가기" : "미션 퀴즈 시작!") : "다음";
  $("#lPrev").textContent = st.li === 0 ? "결과 보기" : "이전";
  $("#lPrev").style.visibility = (st.li === 0 && (inQuiz || st.done)) ? "hidden" : "visible";
}
function startQuiz(){ st.zi = 0; renderQuiz(); show("s-quiz"); }
function renderQuiz(){
  const t = D.types[st.type], Z = t.quiz[st.zi];
  $("#zProg").style.width = (st.zi / t.quiz.length * 100) + "%";
  $("#zNum").textContent = `미션 퀴즈 ${st.zi + 1} / ${t.quiz.length}`;
  $("#zText").textContent = Z.q;
  $("#zFb").textContent = ""; $("#zFb").className = "fb";
  const box = $("#zOpts"); box.innerHTML = "";
  const order = Z.o.map((_, i) => i).sort(() => Math.random() - .5);
  order.forEach(i => {
    const b = document.createElement("button");
    b.className = "qopt"; b.textContent = Z.o[i];
    b.onclick = () => {
      if (box.dataset.lock) return;
      if (i === Z.a){
        box.dataset.lock = 1;
        b.classList.add("right");
        $("#zFb").textContent = "정답! " + (Z.why || ""); $("#zFb").className = "fb ok";
        setTimeout(() => {
          delete box.dataset.lock;
          st.zi++;
          if (st.zi < t.quiz.length) renderQuiz(); else finishQuiz();
        }, 1300);
      } else {
        b.classList.add("wrong"); b.disabled = true;
        $("#zFb").textContent = "아쉬워요! 힌트: " + Z.hint; $("#zFb").className = "fb no";
      }
    };
    box.appendChild(b);
  });
}
function finishQuiz(){
  st.done = true;
  const t = D.types[st.type];
  $("#dStamp").innerHTML = `<div>${icon(st.type, 76)}<div style="font-size:20px;line-height:1.1;margin-top:2px">미션 성공!</div></div>`;
  $("#dTitle").textContent = `${t.nick} ${t.name}`;
  const d = new Date();
  $("#dTime").textContent = `완료 ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  show("s-done");
}
async function sendName(){
  if (st.sent) return;
  const n = cleanName($("#dName").value);
  const toast = $("#dToast");
  if (n === null){ toast.textContent = "다른 이름으로 적어 주세요."; toast.style.color = "var(--bad)"; return; }
  if (!n){ toast.textContent = "이름이나 별명을 적어 주세요."; toast.style.color = "var(--bad)"; return; }
  $("#dSend").disabled = true; toast.textContent = "올리는 중…"; toast.style.color = "var(--ink-2)";
  try {
    await Store.add({n, t: st.type, x: st.px, y: st.py, ts: Date.now()});
    st.sent = true;
    toast.textContent = "보드에 올라갔어요! 큰 화면을 확인해 보세요."; toast.style.color = "var(--mint-2)";
  } catch(e){
    $("#dSend").disabled = false;
    toast.textContent = "연결이 불안정해요. 다시 눌러 주세요."; toast.style.color = "var(--bad)";
  }
}

/* =================== BOARD =================== */
let lastIds = new Set(), entries = {}, deleting = false, firstLoad = true;
function initBoard(){
  document.body.classList.add("board");
  if (!D.map) document.body.classList.add("nomap");
  else { $("#bLegend").style.display = "none"; $("#bMapTitle").textContent = D.map.title; $("#bMapSub").textContent = D.map.sub; }
  document.title = D.boardTitle + " · 보드";
  $("#bTitle").textContent = D.boardTitle;
  $("#bSub").textContent = D.boardSub;
  if (!Store.remote) $("#bMode").textContent = "※ 기기 내 저장 모드: 같은 기기·브라우저에서 참여한 결과만 보입니다. 여러 휴대폰을 연결하려면 FIREBASE_URL을 설정하세요.";
  try {
    const url = location.origin + location.pathname;
    if (window.QRCode && location.protocol.startsWith("http")) new QRCode($("#qr"), {text: url, width: 340, height: 340, colorDark: "#0e5f52", correctLevel: QRCode.CorrectLevel.M});
    else $("#qr").innerHTML = '<div style="width:170px;height:170px;display:grid;place-items:center;font-size:13px;text-align:center;color:#5b716c;border:2px dashed #bfe9df;border-radius:12px">배포 후<br>QR 표시</div>';
  } catch(e){}
  let resetArm = false;
  $("#gear").onclick = () => $("#adm").classList.toggle("on");
  $("#admGo").onclick = () => {
    if ($("#admPin").value === ADMIN_PIN){ $("#admLock").style.display = "none"; $("#admTools").style.display = "block"; deleting = true; document.body.classList.add("deleting"); }
    else $("#admPin").value = "";
  };
  $("#admClose").onclick = () => { $("#adm").classList.remove("on"); deleting = false; document.body.classList.remove("deleting"); $("#admLock").style.display = "block"; $("#admTools").style.display = "none"; $("#admPin").value = ""; resetArm = false; $("#admReset").textContent = "전체 초기화"; };
  $("#admReset").onclick = async () => {
    if (!resetArm){ resetArm = true; $("#admReset").textContent = "한 번 더 누르면 모두 삭제"; return; }
    resetArm = false; $("#admReset").textContent = "전체 초기화";
    await Store.reset(); load();
  };
  $("#bMain").addEventListener("click", async e => {
    if (!deleting) return;
    const g = e.target.closest(".pt"); if (!g) return;
    await Store.del(g.dataset.id); load();
  });
  load();
  setInterval(load, Store.remote ? 3000 : 1500);
  if (bc) bc.onmessage = load;
  window.addEventListener("storage", load);
}
async function load(){
  try { entries = await Store.all(); } catch(e){ return; }
  renderBoard();
}
let lastSig = "";
function renderBoard(){
  const list = Object.entries(entries).filter(([, v]) => v && D.types[v.t]).sort((a, b) => (a[1].ts || 0) - (b[1].ts || 0));
  const sig = list.map(([id]) => id).join("|");
  if (sig === lastSig && !firstLoad) return;
  lastSig = sig;
  const N = list.length, labelFrom = Math.max(0, N - 60), fresh = new Set();
  let pts = "";
  list.forEach(([id, v], i) => {
    const t = D.types[v.t], isNew = !firstLoad && !lastIds.has(id);
    if (isNew) fresh.add(v.t);
    const x = Math.max(-5.7, Math.min(5.7, +v.x || 0)), y = Math.max(-5.7, Math.min(5.7, +v.y || 0));
    pts += `<g class="pt${isNew ? " new" : ""}" data-id="${esc(id)}">
      <circle cx="${x}" cy="${-y}" r=".14" fill="${t.color}" stroke="#fff" stroke-width=".05"/>
      ${i >= labelFrom ? `<text x="${x}" y="${-y - .22}" text-anchor="middle" font-size=".21" font-weight="800" fill="#16302b" stroke="#fff" stroke-width=".07" paint-order="stroke">${esc(v.n)}</text>` : ""}
    </g>`;
  });
  $("#bMain").innerHTML = compassSVG({points: pts, labelR: 4.9, iconSize: .95, labelSize: .3, axisSize: .27});
  lastIds = new Set(list.map(([id]) => id)); firstLoad = false;
  $("#bTotal").textContent = N;
  const counts = {}; SECTORS.forEach(s => counts[s] = 0); list.forEach(([, v]) => counts[v.t]++);
  if (D.map) $("#bMap").innerHTML = mapSVG(counts, fresh);
  const max = Math.max(1, ...Object.values(counts));
  $("#bLegend").innerHTML = SECTORS.map(s => {
    const t = D.types[s];
    return `<div class="lg">${icon(s, 30)}<span style="width:120px">${esc(t.name)}</span>
      <span class="bar"><i style="width:${counts[s] / max * 100}%;background:${t.color}"></i></span><span class="n">${counts[s]}</span></div>`;
  }).join("");
}

if (new URLSearchParams(location.search).has("board")) initBoard(); else initApp();
})();
</script>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>나와 닮은 멸종위기 동물 찾기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --accent:#2f7a4f; --accent-soft:#e3f1e8; --bg:#f2f6f1;
  --ink:#1f2328; --ink-2:#57606a; --line:#e3e6ea; --card:#fff;
  --ok:#1f8a4c; --bad:#c43d3d;
  color-scheme: light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;word-break:keep-all;line-height:1.55}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit}
.app{max-width:480px;margin:0 auto;min-height:100%;padding:20px 16px 40px;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;animation:fade .35s ease}
.screen.on{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:20px;padding:22px 20px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06)}
.btn{display:block;width:100%;padding:16px;border-radius:14px;background:var(--accent);color:#fff;font-weight:700;font-size:17px;
  transition:transform .1s, filter .15s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700}

/* intro */
.hero{text-align:center;padding:28px 4px 8px}
.hero .kicker{font-size:14px;font-weight:700;color:var(--accent);letter-spacing:.02em}
.hero h1{font-size:30px;line-height:1.25;margin:10px 0 12px;font-weight:800}
.hero p{color:var(--ink-2);font-size:16px}
.steps{margin:22px 0;display:grid;gap:10px}
.step{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:14px 16px}
.step b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:15px}
.spacer{flex:1}

/* question */
.prog{height:8px;background:rgba(0,0,0,.07);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.qnum{font-size:14px;font-weight:700;color:var(--accent);margin-top:14px}
.qtext{font-size:23px;font-weight:800;line-height:1.35;margin:8px 0 22px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:2px solid transparent;border-radius:16px;
  padding:18px 16px;margin-bottom:12px;font-size:17px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:border-color .15s, transform .1s}
.opt:active{transform:scale(.98)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt .em{font-size:28px;flex:none}
.back{align-self:flex-start;color:var(--ink-2);font-size:14px;padding:6px 0}

/* result */
.badge{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;font-size:40px;font-weight:800;color:#fff;margin:0 auto 10px}
.badge.sm{width:28px;height:28px;font-size:14px;margin:0}
.rtitle{text-align:center}
.rtitle .nick{font-size:15px;font-weight:700}
.rtitle h2{font-size:30px;font-weight:800;margin:2px 0 6px}
.rtitle p{color:var(--ink-2)}
.traits{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0 4px}
.compass-wrap{margin:18px 0}
.compass-wrap svg{width:100%;height:auto;display:block}
.sec-title{font-size:15px;font-weight:800;margin-bottom:8px}

/* tiebreak */
.tb{display:grid;gap:12px;margin-top:8px}
.tb .opt{flex-direction:column;align-items:flex-start;gap:6px}
.tb .opt .head{display:flex;gap:10px;align-items:center}

/* learn */
.lcard{flex:1;display:flex;flex-direction:column}
.lcard .pg{font-size:13px;font-weight:700;color:var(--accent)}
.lcard h3{font-size:24px;line-height:1.3;margin:6px 0 14px;font-weight:800}
.lcard .body{font-size:17px;line-height:1.7}
.lcard .body p{margin-bottom:12px}
.lcard .body b{background:linear-gradient(transparent 58%, var(--accent-soft) 58%)}
.fact{margin-top:6px;padding:14px 16px;border-radius:14px;background:var(--accent-soft);font-weight:700;font-size:16px}
.src{margin-top:12px;font-size:12px;color:var(--ink-2)}
.dots{display:flex;gap:6px;justify-content:center;margin:16px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(0,0,0,.15)}
.dots i.on{background:var(--accent);width:22px;border-radius:99px}

/* quiz */
.qopt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:10px;font-size:17px;font-weight:600}
.qopt.right{border-color:var(--ok);background:#e9f7ef}
.qopt.wrong{border-color:var(--bad);background:#fbecec;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{min-height:52px;font-weight:700;font-size:15px;margin:4px 0 12px}
.fb.ok{color:var(--ok)} .fb.no{color:var(--bad)}

/* done */
.stamp{width:150px;height:150px;border-radius:50%;margin:10px auto 14px;border:6px double var(--accent);color:var(--accent);display:grid;place-items:center;
  font-weight:900;font-size:22px;transform:rotate(-12deg);animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{transform:scale(2.2) rotate(-12deg);opacity:0}to{transform:scale(1) rotate(-12deg);opacity:1}}
.namein{width:100%;padding:16px;font-size:18px;border:2px solid var(--line);border-radius:14px;margin:10px 0;text-align:center;outline:none}
.namein:focus{border-color:var(--accent)}
.toast{margin-top:10px;text-align:center;font-weight:700;min-height:24px}

/* board */
body.board{background:#0f1720;color:#e8edf2;overflow:hidden}
body.board .app{display:none}
.bwrap{display:none}
body.board .bwrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;height:100vh;padding:24px}
.bmain{display:flex;align-items:center;justify-content:center;min-height:0}
.bmain svg{height:100%;max-height:calc(100vh - 48px);width:auto;max-width:100%}
.bside{display:flex;flex-direction:column;gap:16px;min-height:0}
.bside h1{font-size:28px;line-height:1.25;font-weight:800}
.bside .sub{color:#9fb0c0}
.bcount{font-size:15px;color:#9fb0c0}
.bcount b{font-size:40px;color:#fff;display:block;line-height:1.1}
.qrbox{background:#fff;border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center;color:#1f2328}
.qrbox #qr{flex:none}
.qrbox #qr img,.qrbox #qr canvas{width:110px!important;height:110px!important}
.qrbox p{font-weight:800;font-size:16px;line-height:1.35}
.legend{display:grid;gap:6px;overflow:auto;min-height:0}
.lg{display:flex;align-items:center;gap:10px;font-size:15px}
.lg .bar{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.lg .bar i{display:block;height:100%}
.lg .n{width:28px;text-align:right;font-weight:800}
.bmode{font-size:12px;color:#f0b35a}
.gear{position:fixed;right:14px;bottom:12px;color:#55667a;font-size:13px}
.adm{position:fixed;right:14px;bottom:40px;background:#1c2733;border:1px solid #2c3a49;border-radius:12px;padding:14px;display:none;width:260px;font-size:14px}
.adm.on{display:block}
.adm input{width:100%;padding:8px;border-radius:8px;border:1px solid #3a4a5c;background:#0f1720;color:#fff;margin:6px 0}
.adm button{padding:8px 10px;border-radius:8px;background:#2c3a49;margin:4px 4px 0 0}
.adm button.danger{background:#7a2b2b}
body.deleting .pt{cursor:pointer}
body.deleting .pt:hover circle{stroke:#ff6b6b;stroke-width:.08}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.6)}100%{transform:scale(1)}}
.pt.new circle{transform-box:fill-box;transform-origin:center;animation:pop .6s ease}
@media (max-width:900px){body.board{overflow:auto} body.board .bwrap{grid-template-columns:1fr;height:auto}}
</style>
</head>
<body>
<div class="app">

  <!-- intro -->
  <section class="screen on" id="s-intro">
    <div class="hero">
      <div class="kicker" id="i-kicker"></div>
      <h1 id="i-title"></h1>
      <p id="i-sub"></p>
    </div>
    <div class="steps">
      <div class="step"><b>1</b><div><strong>10가지 질문</strong>에 답하고 나의 유형 찾기</div></div>
      <div class="step"><b>2</b><div>내 유형과 연결된 <strong>이야기 카드</strong> 읽기</div></div>
      <div class="step"><b>3</b><div><strong>미션 퀴즈 3문제</strong> 풀고 도장 받기</div></div>
      <div class="step"><b>4</b><div>좌표 보드에 <strong>내 이름</strong> 올리기</div></div>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="startBtn">시작하기</button>
  </section>

  <!-- question -->
  <section class="screen" id="s-q">
    <button class="back" id="qBack">← 이전</button>
    <div class="prog"><i id="qProg"></i></div>
    <div class="qnum" id="qNum"></div>
    <div class="qtext" id="qText"></div>
    <div id="qOpts"></div>
  </section>

  <!-- tiebreak -->
  <section class="screen" id="s-tb">
    <div class="qnum">마지막 질문</div>
    <div class="qtext">두 유형의 경계에 딱 서 있어요!<br>둘 중 더 궁금한 이야기는?</div>
    <div class="tb" id="tbOpts"></div>
  </section>

  <!-- result -->
  <section class="screen" id="s-res">
    <div class="card">
      <div class="rtitle">
        <div class="badge" id="rBadge"></div>
        <div class="nick" id="rNick"></div>
        <h2 id="rName"></h2>
        <p id="rTag"></p>
      </div>
      <div class="traits" id="rTraits"></div>
      <div class="compass-wrap" id="rCompass"></div>
      <p class="small muted" style="text-align:center" id="rAxis"></p>
    </div>
    <div style="height:16px"></div>
    <button class="btn" id="toLearn">이야기 카드 보러 가기 →</button>
  </section>

  <!-- learn -->
  <section class="screen" id="s-learn">
    <div class="card lcard">
      <div class="pg" id="lPg"></div>
      <h3 id="lH"></h3>
      <div class="body" id="lBody"></div>
      <div class="spacer"></div>
      <div class="src" id="lSrc"></div>
    </div>
    <div class="dots" id="lDots"></div>
    <div class="row">
      <button class="btn ghost" id="lPrev" style="flex:1">이전</button>
      <button class="btn" id="lNext" style="flex:2">다음</button>
    </div>
  </section>

  <!-- quiz -->
  <section class="screen" id="s-quiz">
    <div class="prog"><i id="zProg"></i></div>
    <div class="qnum" id="zNum"></div>
    <div class="qtext" id="zText"></div>
    <div id="zOpts"></div>
    <div class="fb" id="zFb"></div>
    <div class="spacer"></div>
    <button class="btn ghost" id="zPeek">카드 다시 보기</button>
  </section>

  <!-- done -->
  <section class="screen" id="s-done">
    <div class="card" style="text-align:center">
      <div class="stamp" id="dStamp">미션<br>성공!</div>
      <h2 style="font-size:24px;font-weight:800" id="dTitle"></h2>
      <p class="muted" style="margin:6px 0 4px">부스 선생님께 이 화면을 보여주고<br>상품을 받으세요!</p>
      <p class="small muted" id="dTime"></p>
    </div>
    <div style="height:16px"></div>
    <div class="card">
      <div class="sec-title">좌표 보드에 이름 올리기</div>
      <p class="small muted">별명도 괜찮아요. (최대 8글자)</p>
      <input class="namein" id="dName" maxlength="8" placeholder="이름 또는 별명" autocomplete="off">
      <button class="btn" id="dSend">보드에 올리기</button>
      <div class="toast" id="dToast"></div>
    </div>
    <div style="height:12px"></div>
    <button class="btn ghost" id="dAgain">처음부터 다시 하기</button>
  </section>
</div>

<!-- board -->
<div class="bwrap">
  <div class="bmain" id="bMain"></div>
  <div class="bside">
    <div>
      <h1 id="bTitle"></h1>
      <div class="sub" id="bSub"></div>
    </div>
    <div class="qrbox"><div id="qr"></div><p>휴대폰으로<br>QR을 찍고<br>참여하세요!</p></div>
    <div class="bcount"><b id="bTotal">0</b>명 참여</div>
    <div class="legend" id="bLegend"></div>
    <div class="bmode" id="bMode"></div>
  </div>
  <button class="gear" id="gear">관리</button>
  <div class="adm" id="adm">
    <div id="admLock">
      관리자 PIN
      <input type="password" id="admPin" inputmode="numeric">
      <button id="admGo">확인</button>
    </div>
    <div id="admTools" style="display:none">
      <div>점을 클릭하면 삭제됩니다.</div>
      <button id="admReset" class="danger">전체 초기화</button>
      <button id="admClose">닫기</button>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   설정 (배포 전에 여기만 바꾸면 됩니다)
   FIREBASE_URL : Firebase Realtime Database 주소
                  예) "https://my-booth-default-rtdb.asia-southeast1.firebasedatabase.app"
                  비워두면 이 기기 안에만 저장됩니다(보드도 같은 기기·브라우저에서만 보임).
   ADMIN_PIN    : 보드 화면의 '관리' 버튼 PIN (점 삭제, 전체 초기화)
   ===================================================================== */
const FIREBASE_URL = "";

<script>
(() => {
const D = DATA;
const ROOM = D.room;
const SECTORS = ["ENE","NNE","NNW","WNW","WSW","SSW","SSE","ESE"];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- geometry ---------- */
function sectorOf(x, y){
  const a = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  return SECTORS[Math.min(7, Math.floor(a / 45))];
}
function tieCandidates(x, y){
  if (x > 0 && y > 0) return ["NNE","ENE"];
  if (x < 0 && y > 0) return ["NNW","WNW"];
  if (x < 0 && y < 0) return ["SSW","WSW"];
  return ["SSE","ESE"];
}
function placePoint(x, y, type){
  for (let i = 0; i < 80; i++){
    const px = x + (Math.random() * 1.6 - 0.8), py = y + (Math.random() * 1.6 - 0.8);
    if (Math.abs(px) < 5.6 && Math.abs(py) < 5.6 && sectorOf(px, py) === type) return [round(px), round(py)];
  }
  const k = SECTORS.indexOf(type), a = (k * 45 + 22.5) * Math.PI / 180, r = Math.max(1, Math.hypot(x, y));
  return [round(Math.cos(a) * r), round(Math.sin(a) * r)];
}
const round = v => Math.round(v * 100) / 100;

/* ---------- compass SVG ---------- */
function compassSVG(opts){
  const R = 6, dark = !!opts.dark;
  const P = i => { const k = ((i % 8) + 8) % 8; return [[R,0],[R,R],[0,R],[-R,R],[-R,0],[-R,-R],[0,-R],[R,-R]][k]; };
  let wedges = "", labels = "";
  SECTORS.forEach((s, k) => {
    const t = D.types[s], a = P(k), b = P(k + 1);
    const hi = opts.highlight === s;
    wedges += `<polygon points="0,0 ${a[0]},${-a[1]} ${b[0]},${-b[1]}" fill="${t.color}" fill-opacity="${hi ? .32 : (dark ? .13 : .1)}" />`;
    const ang = (k * 45 + 22.5) * Math.PI / 180, lr = opts.labelR || 4.35;
    const lx = Math.cos(ang) * lr, ly = -Math.sin(ang) * lr;
    const fs = opts.labelSize || .42;
    labels += `<g opacity="${opts.highlight && !hi ? .45 : 1}">
      <circle cx="${lx}" cy="${ly - fs*0.9}" r="${fs*0.85}" fill="${t.color}"/>
      <text x="${lx}" y="${ly - fs*0.9}" text-anchor="middle" dominant-baseline="central" font-size="${fs}" font-weight="800" fill="#fff">${esc(t.icon)}</text>
      <text x="${lx}" y="${ly + fs*0.75}" text-anchor="middle" dominant-baseline="central" font-size="${fs*0.95}" font-weight="800" fill="${dark ? '#e8edf2' : '#1f2328'}">${esc(t.name)}</text>
    </g>`;
  });
  const line = dark ? "#3a4a5c" : "#c9d1d9", txt = dark ? "#9fb0c0" : "#57606a";
  let diag = "";
  [[R,R],[-R,R]].forEach(([x,y]) => diag += `<line x1="${-x}" y1="${y}" x2="${x}" y2="${-y}" stroke="${line}" stroke-width=".03" stroke-dasharray=".12 .12"/>`);
  const ax = D.axes, af = opts.axisSize || .36;
  const axes = `
    <line x1="${-R}" y1="0" x2="${R}" y2="0" stroke="${line}" stroke-width=".05"/>
    <line x1="0" y1="${-R}" x2="0" y2="${R}" stroke="${line}" stroke-width=".05"/>
    <text x="${R-0.1}" y="-.18" text-anchor="end" font-size="${af}" font-weight="700" fill="${txt}">${esc(ax.x[1])} →</text>
    <text x="${-R+0.1}" y="-.18" text-anchor="start" font-size="${af}" font-weight="700" fill="${txt}">← ${esc(ax.x[0])}</text>
    <text x=".15" y="${-R+0.45}" font-size="${af}" font-weight="700" fill="${txt}">↑ ${esc(ax.y[1])}</text>
    <text x=".15" y="${R-0.2}" font-size="${af}" font-weight="700" fill="${txt}">↓ ${esc(ax.y[0])}</text>`;
  return `<svg viewBox="${-R} ${-R} ${2*R} ${2*R}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(D.boardTitle)} 좌표">
    <rect x="${-R}" y="${-R}" width="${2*R}" height="${2*R}" rx=".4" fill="${dark ? '#16212c' : '#fafbfc'}"/>
    ${wedges}${diag}${axes}${labels}<g id="pts">${opts.points || ""}</g></svg>`;
}

/* ---------- storage ---------- */
let mem = {};
const LS = {
  get(){ try { return JSON.parse(localStorage.getItem("booth:" + ROOM) || "{}"); } catch(e){ return mem; } },
  set(v){ mem = v; try { localStorage.setItem("booth:" + ROOM, JSON.stringify(v)); } catch(e){} }
};
let bc = null; try { bc = new BroadcastChannel("booth:" + ROOM); } catch(e){}
const Store = {
  remote: !!FIREBASE_URL,
  base(){ return FIREBASE_URL.replace(/\/+$/, "") + "/" + ROOM + "/entries"; },
  async add(entry){
    if (this.remote){
      const r = await fetch(this.base() + ".json", {method:"POST", body: JSON.stringify(entry)});
      if (!r.ok) throw new Error("save " + r.status);
      return;
    }
    const all = LS.get(); all["l" + Date.now() + Math.random().toString(36).slice(2,6)] = entry; LS.set(all);
    if (bc) bc.postMessage("u");
  },
  async all(){
    if (this.remote){
      const r = await fetch(this.base() + ".json", {cache:"no-store"});
      if (!r.ok) throw new Error("load " + r.status);
      return (await r.json()) || {};
    }
    return LS.get();
  },
  async del(id){
    if (this.remote){ await fetch(this.base() + "/" + encodeURIComponent(id) + ".json", {method:"DELETE"}); return; }
    const all = LS.get(); delete all[id]; LS.set(all); if (bc) bc.postMessage("u");
  },
  async reset(){
    if (this.remote){ await fetch(this.base() + ".json", {method:"DELETE"}); return; }
    LS.set({}); if (bc) bc.postMessage("u");
  }
};

/* ---------- name filter ---------- */
const BAD = ["씨발","시발","ㅅㅂ","ㅆㅂ","병신","ㅂㅅ","개새","새끼","좆","존나","ㅈㄴ","미친","지랄","fuck","shit","bitch"];
function cleanName(s){
  s = (s || "").replace(/\s+/g, " ").trim().slice(0, 8);
  const flat = s.toLowerCase().replace(/[^가-힣ㄱ-ㅎa-z]/g, "");
  if (BAD.some(w => flat.includes(w))) return null;
  return s;
}

/* =================== PARTICIPANT APP =================== */
const st = { qi:0, ans:[], x:0, y:0, type:null, li:0, zi:0, done:false, sent:false, quizOrder:null };

function show(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
  $("#" + id).classList.add("on");
  window.scrollTo(0, 0);
}

function initApp(){
  document.title = D.title;
  $("#i-kicker").textContent = D.kicker;
  $("#i-title").innerHTML = D.titleHTML;
  $("#i-sub").textContent = D.subtitle;
  $("#startBtn").onclick = () => { st.qi = 0; st.ans = []; renderQ(); show("s-q"); };
  $("#qBack").onclick = () => {
    if (st.qi === 0){ show("s-intro"); return; }
    st.qi--; st.ans.pop(); renderQ();
  };
  $("#toLearn").onclick = () => { st.li = 0; renderLearn(); show("s-learn"); };
  $("#lPrev").onclick = () => { if (st.li > 0){ st.li--; renderLearn(); } else show("s-res"); };
  $("#lNext").onclick = () => {
    const L = D.types[st.type].learn;
    if (st.li < L.length - 1){ st.li++; renderLearn(); }
    else if (st.done) show("s-done");
    else if (st.zi > 0) show("s-quiz");
    else startQuiz();
  };
  $("#zPeek").onclick = () => { st.li = 0; renderLearn(true); show("s-learn"); };
  $("#dSend").onclick = sendName;
  $("#dName").addEventListener("keydown", e => { if (e.key === "Enter") sendName(); });
  $("#dAgain").onclick = () => { Object.assign(st, {qi:0, ans:[], x:0, y:0, type:null, li:0, zi:0, done:false, sent:false}); $("#dName").value=""; $("#dToast").textContent=""; $("#dSend").disabled=false; show("s-intro"); };
}

function renderQ(){
  const Q = D.questions[st.qi];
  $("#qProg").style.width = (st.qi / D.questions.length * 100) + "%";
  $("#qNum").textContent = `Q${st.qi + 1} / ${D.questions.length}`;
  $("#qText").textContent = Q.q;
  $("#qBack").style.visibility = "visible";
  const box = $("#qOpts"); box.innerHTML = "";
  [Q.a, Q.b].forEach(o => {
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = `<span class="em">${o.e}</span><span>${esc(o.t)}</span>`;
    b.onclick = () => {
      if (box.dataset.lock) return; box.dataset.lock = 1;
      b.classList.add("sel");
      st.ans.push({axis: Q.axis, v: o.v});
      setTimeout(() => { delete box.dataset.lock; next(); }, 260);
    };
    box.appendChild(b);
  });
}
function next(){
  st.qi++;
  if (st.qi < D.questions.length){ renderQ(); return; }
  st.x = st.ans.filter(a => a.axis === "x").reduce((s, a) => s + a.v, 0);
  st.y = st.ans.filter(a => a.axis === "y").reduce((s, a) => s + a.v, 0);
  if (Math.abs(st.x) === Math.abs(st.y)) { renderTie(); show("s-tb"); }
  else { finishType(sectorOf(st.x, st.y)); }
}
function renderTie(){
  const box = $("#tbOpts"); box.innerHTML = "";
  tieCandidates(st.x, st.y).forEach(s => {
    const t = D.types[s];
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = `<div class="head"><span class="badge sm" style="background:${t.color}">${esc(t.icon)}</span><strong>${esc(t.teaser)}</strong></div>`;
    b.onclick = () => finishType(s);
    box.appendChild(b);
  });
}
function finishType(s){
  st.type = s; st.zi = 0; st.done = false; st.sent = false;
  const t = D.types[s];
  [st.px, st.py] = placePoint(st.x, st.y, s);
  $("#rBadge").textContent = t.icon; $("#rBadge").style.background = t.color;
  $("#rNick").textContent = t.nick; $("#rNick").style.color = t.color;
  $("#rName").textContent = t.name;
  $("#rTag").textContent = t.tagline;
  $("#rTraits").innerHTML = t.traits.map(x => `<span class="chip" style="background:${t.color}1f;color:${t.color}">#${esc(x)}</span>`).join("");
  const me = `<g><circle cx="${st.px}" cy="${-st.py}" r=".32" fill="${t.color}" stroke="#fff" stroke-width=".1"/>
    <text x="${st.px}" y="${-st.py - .55}" text-anchor="middle" font-size=".42" font-weight="800" fill="#1f2328">나</text></g>`;
  $("#rCompass").innerHTML = compassSVG({highlight: s, points: me, labelSize:.4});
  const xl = st.x > 0 ? D.axes.x[1] : D.axes.x[0], yl = st.y > 0 ? D.axes.y[1] : D.axes.y[0];
  $("#rAxis").textContent = `${xl} ${Math.abs(st.x)}점 · ${yl} ${Math.abs(st.y)}점`;
  show("s-res");
}

function renderLearn(peek){
  const t = D.types[st.type], L = t.learn, c = L[st.li];
  $("#lPg").textContent = `${t.name} 이야기 ${st.li + 1} / ${L.length}`;
  $("#lH").textContent = c.h;
  $("#lBody").innerHTML = c.body.map(p => `<p>${p}</p>`).join("") + (c.fact ? `<div class="fact">${c.fact}</div>` : "");
  $("#lSrc").textContent = c.src ? "출처: " + c.src : "";
  $("#lDots").innerHTML = L.map((_, i) => `<i class="${i === st.li ? "on" : ""}"></i>`).join("");
  const last = st.li === L.length - 1;
  const inQuiz = st.zi > 0 && !st.done;
  $("#lNext").textContent = last ? (st.done ? "완료 화면으로" : inQuiz ? "퀴즈로 돌아가기" : "미션 퀴즈 시작!") : "다음";
  $("#lPrev").textContent = st.li === 0 ? (inQuiz || st.done ? "이전" : "결과 보기") : "이전";
  if (st.li === 0 && (inQuiz || st.done)) $("#lPrev").style.visibility = "hidden"; else $("#lPrev").style.visibility = "visible";
}
function startQuiz(){
  st.zi = 0; renderQuiz(); show("s-quiz");
}
function renderQuiz(){
  const t = D.types[st.type], Z = t.quiz[st.zi];
  $("#zProg").style.width = (st.zi / t.quiz.length * 100) + "%";
  $("#zNum").textContent = `미션 퀴즈 ${st.zi + 1} / ${t.quiz.length}`;
  $("#zText").textContent = Z.q;
  $("#zFb").textContent = ""; $("#zFb").className = "fb";
  const box = $("#zOpts"); box.innerHTML = "";
  const order = Z.o.map((_, i) => i).sort(() => Math.random() - .5);
  order.forEach(i => {
    const b = document.createElement("button");
    b.className = "qopt"; b.textContent = Z.o[i];
    b.onclick = () => {
      if (box.dataset.lock) return;
      if (i === Z.a){
        box.dataset.lock = 1;
        b.classList.add("right");
        $("#zFb").textContent = "정답! " + (Z.why || ""); $("#zFb").className = "fb ok";
        setTimeout(() => {
          delete box.dataset.lock;
          st.zi++;
          if (st.zi < t.quiz.length) renderQuiz(); else finishQuiz();
        }, 1300);
      } else {
        b.classList.add("wrong"); b.disabled = true;
        $("#zFb").textContent = "아쉬워요! 힌트: " + Z.hint; $("#zFb").className = "fb no";
      }
    };
    box.appendChild(b);
  });
}
function finishQuiz(){
  st.done = true;
  const t = D.types[st.type];
  $("#dStamp").style.borderColor = t.color; $("#dStamp").style.color = t.color;
  $("#dTitle").textContent = `${t.nick} ${t.name}`;
  const d = new Date();
  $("#dTime").textContent = `완료 ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  show("s-done");
}
async function sendName(){
  if (st.sent) return;
  const n = cleanName($("#dName").value);
  const toast = $("#dToast");
  if (n === null){ toast.textContent = "다른 이름으로 적어 주세요."; toast.style.color = "var(--bad)"; return; }
  if (!n){ toast.textContent = "이름이나 별명을 적어 주세요."; toast.style.color = "var(--bad)"; return; }
  $("#dSend").disabled = true; toast.textContent = "올리는 중…"; toast.style.color = "var(--ink-2)";
  try {
    await Store.add({n, t: st.type, x: st.px, y: st.py, ts: Date.now()});
    st.sent = true;
    toast.textContent = "보드에 올라갔어요! 큰 화면을 확인해 보세요."; toast.style.color = "var(--ok)";
  } catch(e){
    $("#dSend").disabled = false;
    toast.textContent = "연결이 불안정해요. 다시 눌러 주세요."; toast.style.color = "var(--bad)";
  }
}

/* =================== BOARD =================== */
let lastIds = new Set(), entries = {}, deleting = false, firstLoad = true;
function initBoard(){
  document.body.classList.add("board");
  document.title = D.boardTitle + " · 보드";
  $("#bTitle").textContent = D.boardTitle;
  $("#bSub").textContent = D.boardSub;
  if (!Store.remote) $("#bMode").textContent = "※ 기기 내 저장 모드: 같은 기기·브라우저에서 참여한 결과만 보입니다. 여러 휴대폰을 연결하려면 FIREBASE_URL을 설정하세요.";
  try {
    const url = location.origin + location.pathname;
    if (window.QRCode && location.protocol.startsWith("http")) new QRCode($("#qr"), {text: url, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M});
    else $("#qr").innerHTML = '<div style="width:110px;height:110px;display:grid;place-items:center;font-size:12px;text-align:center;color:#57606a">배포 후<br>QR 표시</div>';
  } catch(e){}
  $("#gear").onclick = () => $("#adm").classList.toggle("on");
  $("#admGo").onclick = () => {
    if ($("#admPin").value === ADMIN_PIN){ $("#admLock").style.display = "none"; $("#admTools").style.display = "block"; deleting = true; document.body.classList.add("deleting"); }
    else $("#admPin").value = "";
  };
  $("#admClose").onclick = () => { $("#adm").classList.remove("on"); deleting = false; document.body.classList.remove("deleting"); $("#admLock").style.display = "block"; $("#admTools").style.display = "none"; $("#admPin").value = ""; resetArm = false; $("#admReset").textContent = "전체 초기화"; };
  let resetArm = false;
  $("#admReset").onclick = async () => {
    if (!resetArm){ resetArm = true; $("#admReset").textContent = "한 번 더 누르면 모두 삭제"; return; }
    resetArm = false; $("#admReset").textContent = "전체 초기화";
    await Store.reset(); load();
  };
  $("#bMain").addEventListener("click", async e => {
    if (!deleting) return;
    const g = e.target.closest(".pt"); if (!g) return;
    await Store.del(g.dataset.id); load();
  });
  load();
  setInterval(load, Store.remote ? 3000 : 1500);
  if (bc) bc.onmessage = load;
  window.addEventListener("storage", load);
}
async function load(){
  try { entries = await Store.all(); } catch(e){ return; }
  renderBoard();
}
function renderBoard(){
  const list = Object.entries(entries).filter(([, v]) => v && D.types[v.t]).sort((a, b) => (a[1].ts || 0) - (b[1].ts || 0));
  const N = list.length, labelFrom = Math.max(0, N - 60);
  let pts = "";
  list.forEach(([id, v], i) => {
    const t = D.types[v.t], isNew = !firstLoad && !lastIds.has(id);
    const x = Math.max(-5.7, Math.min(5.7, +v.x || 0)), y = Math.max(-5.7, Math.min(5.7, +v.y || 0));
    pts += `<g class="pt${isNew ? " new" : ""}" data-id="${esc(id)}">
      <circle cx="${x}" cy="${-y}" r=".13" fill="${t.color}" stroke="#0f1720" stroke-width=".03"/>
      ${i >= labelFrom ? `<text x="${x}" y="${-y - .2}" text-anchor="middle" font-size=".2" font-weight="700" fill="#e8edf2">${esc(v.n)}</text>` : ""}
    </g>`;
  });
  $("#bMain").innerHTML = compassSVG({dark: true, points: pts, labelR: 5.05, labelSize: .3, axisSize: .26});
  lastIds = new Set(list.map(([id]) => id)); firstLoad = false;
  $("#bTotal").textContent = N;
  const counts = {}; SECTORS.forEach(s => counts[s] = 0); list.forEach(([, v]) => counts[v.t]++);
  const max = Math.max(1, ...Object.values(counts));
  $("#bLegend").innerHTML = SECTORS.map(s => {
    const t = D.types[s];
    return `<div class="lg"><span class="badge sm" style="background:${t.color}">${esc(t.icon)}</span>
      <span style="width:110px">${esc(t.name)}</span>
      <span class="bar"><i style="width:${counts[s] / max * 100}%;background:${t.color}"></i></span><span class="n">${counts[s]}</span></div>`;
  }).join("");
}

if (new URLSearchParams(location.search).has("board")) initBoard(); else initApp();
})();
</script>
